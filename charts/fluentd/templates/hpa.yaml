{{- if and  ( eq  .Values.kind "Deployment" )  .Values.autoscaling.enabled  }}
{{- range $index, $zone := include "fluentd.zones" . | fromJsonArray }}
{{- $ctx := dict }}
{{- $_ := include "fluentd.zoneContext" (dict "root" $ "zone" $zone "ctx" $ctx) }}
{{- with $ctx }}
{{- if $index }}
---
{{- end }}
apiVersion: {{ include "fluentd.hpa.apiVersion" . }}
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fluentd.workloadName" . }}
  labels:
    {{- include "fluentd.labels" . | nindent 4 }}
    {{- with .Zone }}
    zone: {{ . }}
    {{- end }}
spec:
  {{- if .Values.autoscaling.behavior }}
  behavior:
    {{- toYaml .Values.autoscaling.behavior | nindent 4 }}
  {{- end }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fluentd.workloadName" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
  {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
          type: Utilization
  {{- end }}
  {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
          type: Utilization
  {{- end }}
  {{- if .Values.autoscaling.customRules -}}
    {{- toYaml .Values.autoscaling.customRules | nindent 4}}
  {{- end -}}
{{- end }}
{{- end }}
{{- end }}
